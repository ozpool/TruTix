# Render blueprint for the TruTix API. Import via Render → New → Blueprint, then
# fill the secret env vars marked `sync: false` in the dashboard.
#
# Note: on the free plan the service sleeps when idle, so no polling happens
# until the next request wakes it. The indexer resumes from its persisted
# cursor and backfills the gap; set INDEXER_BACKFILL_RPC_URL to a deep-history
# RPC (e.g. Envio HyperRPC) to make that catch-up fast instead of stepping
# through the primary RPC's small block-range cap.
services:
  - type: web
    name: trutix-api
    runtime: node
    plan: free
    rootDir: .
    buildCommand: corepack enable && pnpm install --frozen-lockfile
    startCommand: pnpm --filter @trutix/server start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: NODE_ENV
        value: production
      # Mongo Atlas connection string.
      - key: MONGO_URI
        sync: false
      # Strong random secret, at least 32 characters (e.g. `openssl rand -hex 32`).
      - key: JWT_SECRET
        sync: false
      # Must equal the deployed frontend origin host, e.g. `trutix.vercel.app`.
      - key: SIWE_DOMAIN
        sync: false
      # Base Sepolia JSON-RPC endpoint (a dedicated provider is recommended).
      - key: RPC_URL
        sync: false
      # Private key of the redeemer wallet authorized to mark tickets redeemed.
      - key: BACKEND_PRIVATE_KEY
        sync: false
      - key: EVENT_TICKET_ADDR
        sync: false
      - key: MARKETPLACE_ADDR
        sync: false
      # Optional; defaults to 60000 (60s). Leave unset in production.
      - key: GATE_FRESHNESS_MS
        sync: false
      # Optional deep-history RPC for indexer catch-up (e.g. an Envio HyperRPC
      # endpoint). Leave unset to disable; the indexer still backfills via the
      # primary RPC, just slower.
      - key: INDEXER_BACKFILL_RPC_URL
        sync: false
